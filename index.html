
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>むぎちゃん会議</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 20px;
      background: #f5f1e9;
      color: #51483f;
      font-family: sans-serif;
    }

    .container {
      max-width: 440px;
      margin: auto;
      text-align: center;
    }

    h1 {
      margin-top: 35px;
      font-size: 27px;
    }

    .sub {
      color: #91877b;
      font-size: 13px;
    }

    .upload-box {
      margin-top: 40px;
      padding: 25px 18px;
      background: white;
      border-radius: 18px;
    }

    input {
      width: 100%;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #9b8068;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
    }

    #preview {
      max-width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>むぎちゃん会議</h1>
    <p class="sub">今日の会議資料を提出してください。</p>

    <div class="upload-box">
      <p>📷 写真を選んでね</p>
      <input type="file" id="photo" accept="image/*">
      <img id="preview" hidden>
      <button id="upload">写真をアップロード</button>
      <p id="status">写真を待っています。</p>
    </div>
  </div>

  <script>
    const CLOUD_NAME = "p5ftkcgl";
    const UPLOAD_PRESET = "mugi_upload";

    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const upload = document.getElementById("upload");

    photo.addEventListener("change", () => {
      const file = photo.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      status.textContent = "写真を確認しました。";
    });

    upload.addEventListener("click", async () => {
      const file = photo.files[0];

      if (!file) {
        status.textContent = "先に写真を選んでね。";
        return;
      }

      upload.disabled = true;
      status.textContent = "アップロード中です…";

      try {
        const data = new FormData();
        data.append("file", file);
        data.append("upload_preset", UPLOAD_PRESET);

        const response = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
          { method: "POST", body: data }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error?.message || "アップロードに失敗しました");
        }

        status.textContent = "アップロードできました！";
      } catch (error) {
        status.textContent = "エラー：" + error.message;
      } finally {
        upload.disabled = false;
      }
    });
  </script>
</body>
</html>
